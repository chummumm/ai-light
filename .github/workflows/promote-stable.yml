name: Promote stable release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-stable.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version to promote, without the v prefix'
        required: true
        default: '0.3.5'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Promote verified release to stable
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          version="$VERSION_INPUT"
          if [[ -z "$version" ]]; then
            version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          RELEASE_VERSION="$version" bash scripts/promote-stable-release.sh
