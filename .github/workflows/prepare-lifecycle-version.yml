name: Prepare lifecycle repair version
on:
  push:
    branches: ['fix/session-lifecycle-evidence']
    paths: ['.github/workflows/prepare-lifecycle-version.yml']
permissions:
  contents: write
jobs:
  version:
    if: github.repository == 'chummumm/ai-light' && github.ref == 'refs/heads/fix/session-lifecycle-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/session-lifecycle-evidence
      - name: Bump only the three workspace package versions
        run: |
          node <<'JS'
          const fs = require('node:fs');
          function edit(path, old, next) {
            const text = fs.readFileSync(path, 'utf8');
            if (!text.includes(old)) throw Error('Unexpected version baseline: ' + path);
            fs.writeFileSync(path, text.replace(old, next));
          }
          edit('Cargo.toml', 'version = "0.3.3"', 'version = "0.3.4"');
          for (const name of ['ai-light', 'light-core', 'light-agent']) {
            edit('Cargo.lock', `name = "${name}"\nversion = "0.3.3"`, `name = "${name}"\nversion = "0.3.4"`);
          }
          edit('src-tauri/tauri.conf.json', '"version": "0.3.3"', '"version": "0.3.4"');
          edit('ui/index.html', 'id="version">v0.3.3<', 'id="version">v0.3.4<');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src-tauri/tauri.conf.json ui/index.html
          git commit -m 'build: version session lifecycle repair as 0.3.4'
          git push origin HEAD:fix/session-lifecycle-evidence
