[package]
name = "ai-light"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ai-light"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
light-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
windows = { version = "=0.58.0", features = [
  "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation", "Foundation_Collections", "Storage_Streams",
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
